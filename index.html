<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main Menu</title>
<style>
  :root {
    --bg: #0d1110;
    --panel: #121816;
    --line: #26302c;
    --text: #cfd8d3;
    --dim: #6b7873;
    --accent: #c9a23c;
    --sidebar-w: 240px;
    font-family: Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  .sidebar {
    width: var(--sidebar-w);
    height: 100%;
    display: flex;
    flex-direction: column;      
    padding: 28px 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .brand {
    padding: 0 24px 24px;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .menu-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 24px;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: left;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .menu-btn .num { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .menu-btn:hover,
  .menu-btn:focus-visible {
    background: rgba(201, 162, 60, .08);
    border-left-color: var(--accent);
    color: #fff;
    outline: none;
  }
  .menu-btn:active { background: rgba(201, 162, 60, .16); }
  .menu-btn.bottom { margin-top: auto; border-top: 1px solid var(--line); }

  .stage {
    flex: 1;
    min-width: 0;
    padding: 48px;
  }
  .map-picker {
    width: min(100%, 360px);
    margin-left: auto;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .map-picker h1 {
    margin-bottom: 20px;
    color: var(--dim);
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .map-option {
    display: block;
    width: 100%;
    padding: 16px;
    background: rgba(201, 162, 60, .06);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    letter-spacing: 1px;
    text-align: left;
    cursor: pointer;
  }
  .map-option:hover,
  .map-option:focus-visible {
    border-color: var(--accent);
    color: #fff;
    outline: none;
  }
  .map-option span {
    display: block;
    margin-top: 8px;
    color: var(--dim);
    font-size: 11px;
  }
  @media (max-width: 600px) {
    .stage { padding: 24px; }
  }
</style>
</head>
<body>

  <nav class="sidebar">
    <div class="brand">PROJECT</div>

    <button class="menu-btn" id="editorBtn" type="button" aria-expanded="false" aria-controls="mapPicker"><span class="num">01</span>Editor</button>
    <button class="menu-btn" id="testBtn" type="button"><span class="num">02</span>Test</button>

    <button class="menu-btn bottom" id="settingsBtn" type="button"><span class="num">03</span>Settings</button>
  </nav>

  <main class="stage" id="stage"></main>

<script>
  const editorBtn = document.getElementById('editorBtn');
  const stage = document.getElementById('stage');

  editorBtn.addEventListener('click', () => {
    editorBtn.setAttribute('aria-expanded', 'true');
    stage.innerHTML = `
      <section class="map-picker" id="mapPicker" aria-labelledby="mapPickerTitle">
        <h1 id="mapPickerTitle">Select map</h1>
        <button class="map-option" type="button" id="testMapBtn">
          testMap_01
          <span>Open map</span>
        </button>
      </section>
    `;

    document.getElementById('testMapBtn').addEventListener('click', () => {
      window.location.href = 'GAME/game.html';
    });
  });

  document.getElementById('testBtn').addEventListener('click', () => {
  });
  document.getElementById('settingsBtn').addEventListener('click', () => {
  });
</script>
</body>
</html>
