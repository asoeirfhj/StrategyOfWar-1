<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>testMap_01 — Strategy of War</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Consolas, "Courier New", monospace;
      background: #0d1110;
      color: #cfd8d3;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 24px;
      background: #121816;
      border-bottom: 1px solid #26302c;
    }
    a {
      color: #c9a23c;
      text-decoration: none;
    }
    a:hover, a:focus-visible { color: #fff; }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 2px;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 100px);
      object-fit: contain;
      border: 1px solid #26302c;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">← Menu</a>
    <h1>testMap_01</h1>
  </header>
  <main>
    <img src="maps/testMap_01.png" alt="Карта testMap_01">
  </main>
</body>
</html>
